<style>
:root{--red:#6e0000;--red2:#a3110f;--red3:#520000;--yel:#ffa100;--bg:#faf6f0;--ink:#2a1212;--w0:64px;--w1:272px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#FBF7F2;font-family:Poppins,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#palco{position:fixed;top:0;bottom:0;right:0;left:var(--w0)}
#palco iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden;opacity:0;transform:translateX(8px);transition:opacity .28s cubic-bezier(.2,.75,.2,1),transform .28s cubic-bezier(.2,.75,.2,1),visibility 0s .28s}

#carregando{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#6e5a50;font-size:14px}
#carregando .mono{animation:pulsa 1.1s ease-in-out infinite}
@keyframes pulsa{50%{transform:scale(1.08);box-shadow:0 0 0 10px rgba(255,161,0,.15)}}
#lado{position:fixed;top:0;left:0;bottom:0;width:var(--w0);background:linear-gradient(180deg,#2A1B17 0%,#3a120c 50%,#4a0c06 100%);border-right:0;color:#fff;z-index:20;display:flex;flex-direction:column;overflow:hidden;transition:width .16s ease,box-shadow .16s ease}
#lado.aberto{width:var(--w1);box-shadow:10px 0 40px -6px rgba(40,0,0,.45)}
#lado::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px 200px at 0 0,rgba(255,161,0,.14),transparent 70%)}
.topo{height:68px;flex:none;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.mono{font-family:Lora,Georgia,serif;width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(140deg,#ffc04d,#ff9100);box-shadow:0 6px 16px -6px rgba(255,145,0,.8);color:var(--red3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.topo img{height:40px;margin-left:12px;opacity:0;transition:opacity .12s}
.ola{height:0;overflow:hidden;opacity:0;padding:0 18px;white-space:nowrap;transition:opacity .15s,height .16s}
#lado.aberto .ola{height:52px;opacity:1;padding-top:12px}
.ola b{display:block;font-family:Lora,Georgia,serif;font-size:17px;color:#fff}.ola span{font-size:12.5px;color:#e6c3b6}
#lado.aberto .topo img{opacity:1}
#menu{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.app{margin:2px 0}
.ap{all:unset;box-sizing:border-box;display:flex;align-items:center;width:100%;height:46px;padding:0 12px;cursor:pointer;gap:14px;white-space:nowrap;position:relative}
.ap .ic{width:40px;height:40px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#f3dcd4}
.ap svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ap .nm{font-size:15px;font-weight:600;flex:1;opacity:0;transition:opacity .12s}
.ap .sv{width:16px;height:16px;opacity:0;transition:opacity .12s,transform .15s;color:#f3dcd4}
#lado.aberto .ap .nm,#lado.aberto .ap .sv{opacity:1}
.ap:hover .ic,.ap:focus-visible .ic{background:rgba(255,255,255,.1)}
.app.atual .ap .ic{background:linear-gradient(140deg,#ffc04d,#ff9100);color:var(--red3);box-shadow:0 6px 16px -6px rgba(255,145,0,.85)}
.app.atual .ap::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--yel)}
.ap .ic{transition:background .18s,transform .18s,box-shadow .18s}.ap:active .ic{transform:scale(.93)}
.app.atual .ap .nm{color:#fff}.ap .nm{color:#f3dcd4}
.app.gaveta .ap .sv{transform:rotate(90deg)}
.subs{display:none;padding:2px 0 8px 66px;position:relative}
.subs::before{content:"";position:absolute;left:44px;top:4px;bottom:12px;width:1px;background:rgba(255,255,255,.14)}
#lado.aberto .app.gaveta .subs{display:block;animation:gav .22s cubic-bezier(.2,.75,.2,1) both}
@keyframes gav{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.subs button{all:unset;box-sizing:border-box;display:block;width:calc(100% - 12px);padding:7px 12px;border-radius:9px;transition:background .15s,color .15s,transform .15s;font-size:14px;color:#f3dcd4;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subs button:hover,.subs button:focus-visible{background:rgba(255,255,255,.08);color:#fff;transform:translateX(2px)}
.subs button.on{background:linear-gradient(90deg,rgba(255,161,0,.22),rgba(255,161,0,.06));color:#ffc04d;font-weight:600}
.pe{flex:none;border-top:1px solid rgba(255,255,255,.1);padding:10px 12px;display:flex;align-items:center;gap:14px;white-space:nowrap}
.pe button{all:unset;width:40px;height:40px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#f3dcd4}
.pe button:hover{background:rgba(255,255,255,.1)}
.pe button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pe span{font-size:13px;color:#f3dcd4;opacity:0;transition:opacity .12s}
#lado.aberto .pe span{opacity:1}
body.fixo{--w0:var(--w1)}body.fixo #lado{box-shadow:none}
body.fixo .pe button{color:var(--yel)}
@media print{#lado{display:none!important}#palco{left:0}}

/* ===== Anotações e metas ===== */
:root{--sun:#FFB21E;--tomato:#C2412D;--leaf:#2E7D52;--grape:#3D5A80;--line:#EDE3D9;--mut:#6B5A52;--card:#fff}
#notasPg{position:absolute;inset:0;overflow-y:auto;background:#FBF7F2;visibility:hidden;opacity:0;transform:translateX(8px);transition:opacity .28s cubic-bezier(.2,.75,.2,1),transform .28s cubic-bezier(.2,.75,.2,1),visibility 0s .28s}
#notasPg.on{visibility:visible;opacity:1;transform:none;transition:opacity .28s cubic-bezier(.2,.75,.2,1),transform .28s cubic-bezier(.2,.75,.2,1),visibility 0s}
.np{max-width:1180px;margin:0 auto;padding:26px 30px 90px;font-size:14.5px}
.np h2{font-family:Lora,Georgia,serif;font-size:24px;margin:0;color:var(--ink)}
.np .sub{color:var(--mut);font-size:13.5px;margin:2px 0 0}
.np-hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(120deg,#2A1B17 0%,#4a0c06 55%,#6e0000 100%);color:#fff;padding:30px 34px;margin:0 0 26px;box-shadow:0 20px 44px -22px rgba(60,10,0,.7)}
.np-hero i{position:absolute;border-radius:50%;pointer-events:none}
.np-hero .b1{width:230px;height:230px;background:var(--tomato);right:-50px;top:-90px}.np-hero .b2{width:96px;height:96px;background:var(--sun);right:190px;top:40px}.np-hero .b3{width:54px;height:54px;background:var(--leaf);right:120px;top:118px}
.np-hero small{position:relative;display:block;font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase;color:var(--sun);margin-bottom:6px}
.np-hero h1{position:relative;margin:0;font-family:Lora,Georgia,serif;font-size:34px;line-height:1.15}
.np-hero p{position:relative;margin:8px 0 0;color:#f3dcd4;max-width:60%}
.np-res{position:relative;display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.np-res span{background:rgba(255,255,255,.1);border-radius:999px;padding:6px 14px;font-size:13px}.np-res b{color:#fff;font-size:15px}
.np-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 14px}
.np-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;background:var(--red);color:#fff;transition:transform .15s,box-shadow .15s}
.np-btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(110,0,0,.7)}
.np-btn.cl{background:#fff;color:var(--ink);border:2px solid var(--line);padding:7px 16px}.np-btn.cl:hover{border-color:var(--sun);box-shadow:none}
.np-btn.y{background:var(--sun);color:var(--ink)}
.np-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-bottom:34px}
.mt{background:#fff;border-radius:22px;padding:18px 20px 16px;box-shadow:0 10px 30px rgba(42,27,23,.08);display:flex;flex-direction:column;gap:10px;position:relative}
.mt .tp{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mt h3{margin:0;font-family:Lora,Georgia,serif;font-size:18px;line-height:1.25}
.mt .met{font-size:12.5px;color:var(--mut)}
.mt .vv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mt .vv b{font-family:Lora,Georgia,serif;font-size:28px;font-variant-numeric:normal}
.mt .vv span{color:var(--mut);font-size:13.5px}
.gauge{position:relative;height:12px;border-radius:999px;background:#F3EAE0;overflow:visible}
.gauge .f{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .6s cubic-bezier(.2,.75,.2,1)}
.gauge .pj{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ink);opacity:.55}
.gauge .al{position:absolute;right:0;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.mt .rod{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.bdg{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.bdg.ok{background:#DCEFE3;color:#1f5e3c}.bdg.vai{background:#FFF1D6;color:#7a4f00}.bdg.mal{background:#F8DDD6;color:#9b2c1c}.bdg.neu{background:#F1ECE6;color:var(--mut)}
.spk{display:flex;align-items:flex-end;gap:5px;height:44px;padding-top:4px}
.spk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.spk i{display:block;width:100%;border-radius:4px 4px 0 0;min-height:2px}
.spk small{font-size:10.5px;color:var(--mut)}
.mt .acs{display:flex;gap:4px;opacity:.0;transition:opacity .15s}.mt:hover .acs,.mt:focus-within .acs{opacity:1}
.ic-b{all:unset;cursor:pointer;width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut)}
.ic-b:hover{background:#F3EAE0;color:var(--ink)}.ic-b svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mt .lk{all:unset;cursor:pointer;font-size:12.5px;color:var(--red2);font-weight:600}.mt .lk:hover{text-decoration:underline}
.mt.nova{align-items:center;justify-content:center;border:2px dashed #E3D3C2;background:transparent;box-shadow:none;cursor:pointer;min-height:180px;color:var(--mut);font-weight:600}
.mt.nova:hover{border-color:var(--sun);color:var(--ink)}
.mt.arq{opacity:.65}
.np-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.np-bar input[type=search],.np-bar select{border:2px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink);outline:none}
.np-bar input[type=search]{min-width:240px}.np-bar input:focus,.np-bar select:focus{border-color:var(--sun)}
.seg{display:inline-flex;background:#F1ECE6;border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--mut);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 6px rgba(42,27,23,.1)}
.np-mes{font-family:Lora,Georgia,serif;font-size:16px;color:var(--mut);margin:22px 0 10px}
.nt{background:#fff;border-radius:18px;padding:14px 16px 12px;box-shadow:0 6px 20px rgba(42,27,23,.06);margin-bottom:10px;border-left:5px solid var(--c,#ddd);transition:box-shadow .15s}
.nt:hover{box-shadow:0 10px 26px rgba(42,27,23,.1)}
.nt.feito{opacity:.72}.nt.feito .tt{text-decoration:line-through;text-decoration-color:rgba(42,27,23,.35)}
.nt .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.tg{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;color:var(--ink)}
.tg::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,#ccc)}
.nt .tt{all:unset;display:block;width:100%;font-weight:700;font-size:15.5px;margin:6px 0 2px;color:var(--ink)}
.nt textarea{all:unset;display:block;width:100%;white-space:pre-wrap;font-size:14px;line-height:1.5;color:#3d2c26;resize:none;overflow:hidden;min-height:21px}
.nt .tt:focus,.nt textarea:focus{background:#FFF9EF;border-radius:6px;box-shadow:0 0 0 6px #FFF9EF}
.nt .l2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.ctx{all:unset;cursor:pointer;font-size:12.5px;color:var(--red2);font-weight:600}.ctx:hover{text-decoration:underline}
.st{display:inline-flex;background:#F7F1EA;border-radius:999px;padding:2px}
.st button{all:unset;cursor:pointer;padding:3px 10px;border-radius:999px;font-size:12px;color:var(--mut)}
.st button.on.afazer{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.st button.on.fazendo{background:var(--sun);color:var(--ink);font-weight:700}
.st button.on.feito{background:var(--leaf);color:#fff;font-weight:700}
.nt .dir{margin-left:auto;display:flex;gap:2px}
.pin.on{color:var(--sun)!important}.pin.on svg{fill:var(--sun)}
.np-vazio{background:#fff;border-radius:18px;padding:28px;text-align:center;color:var(--mut)}
/* botão flutuante */
#npFab{all:unset;position:fixed;right:18px;bottom:18px;z-index:25;cursor:pointer;display:flex;align-items:center;height:48px;padding:0 14px;border-radius:999px;background:linear-gradient(140deg,#6e0000,#a3110f);color:#fff;font-weight:600;font-size:14px;box-shadow:0 12px 28px -10px rgba(110,0,0,.75);transition:transform .18s,box-shadow .18s;opacity:.92}
#npFab:hover,#npFab:focus-visible{transform:translateY(-2px);box-shadow:0 16px 32px -10px rgba(110,0,0,.8);opacity:1}
#npFab svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#npFab .tx{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .22s,margin .22s}
#npFab:hover .tx,#npFab:focus-visible .tx{max-width:90px;margin:0 2px 0 8px}
#npFab .n{position:absolute;top:-5px;right:-4px;background:var(--sun);color:#2A1B17;border-radius:999px;font-size:11px;font-weight:800;padding:1px 6px;min-width:10px;text-align:center;box-shadow:0 0 0 2px #FBF7F2}
body.notas-on #npFab{display:none}
/* gaveta lateral */
#npSombra{position:fixed;inset:0;z-index:40;background:rgba(42,27,23,.25);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
#npGav{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:94vw;z-index:41;background:#FBF7F2;box-shadow:-20px 0 50px -10px rgba(42,27,23,.35);transform:translateX(105%);transition:transform .26s cubic-bezier(.2,.75,.2,1);display:flex;flex-direction:column;font-size:14px}
body.gav-on #npSombra{opacity:1;visibility:visible;transition:opacity .2s}
body.gav-on #npGav{transform:none}
.gv-top{padding:18px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.gv-top h3{margin:0;font-family:Lora,Georgia,serif;font-size:21px}
.gv-top .onde{font-size:12.5px;color:var(--mut);margin-top:2px}
.gv-c{flex:1;overflow-y:auto;padding:16px 20px 20px}
.gv-form{background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 20px rgba(42,27,23,.07)}
.gv-form input,.gv-form textarea,.gv-form select{width:100%;box-sizing:border-box;border:0;outline:none;font:inherit;color:var(--ink);background:transparent}
.gv-form input{font-weight:700;font-size:15px;padding:2px 0 6px}
.gv-form textarea{min-height:96px;resize:vertical;line-height:1.5}
.gv-form select{border:2px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.chips button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:2px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut)}
.chips button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.chips button.on{border-color:var(--c);color:var(--ink);background:#fff}
.gv-ac{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.gv-ac small{color:var(--mut);font-size:12px}
.gv-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.gv-n{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--c,#ddd);font-size:13.5px}
.gv-n b{display:block;font-size:14px}.gv-n p{margin:2px 0 6px;color:#3d2c26;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gv-n .rd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.gv-m{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.gv-m .rd{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.gv-pe{padding:12px 20px;border-top:1px solid var(--line)}
/* janela de meta */
#npModal{position:fixed;inset:0;z-index:50;background:rgba(42,27,23,.35);display:none;align-items:center;justify-content:center}
#npModal.on{display:flex}
.md{background:#FBF7F2;border-radius:24px;padding:22px 24px;width:520px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(42,27,23,.5)}
.md h3{margin:0 0 12px;font-family:Lora,Georgia,serif;font-size:22px}
.md label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.md input,.md select{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;background:#fff;color:var(--ink);outline:none}
.md input:focus,.md select:focus{border-color:var(--sun)}
.md .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.md .dica{font-size:12.5px;color:var(--mut);margin:8px 0 0;background:#fff;border-radius:12px;padding:8px 12px}
.md .ac{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#npToast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:60;background:#2A1B17;color:#fff;border-radius:999px;padding:10px 12px 10px 20px;font-size:14px;display:flex;gap:12px;align-items:center;opacity:0;visibility:hidden;transition:all .2s}
#npToast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
#npToast button{all:unset;cursor:pointer;color:var(--sun);font-weight:700;padding:2px 8px}
@media print{#npFab,#npGav,#npSombra{display:none!important}}

</style>

<script>
/* Mariá · ponte entre o Gestão e o sistema.
   Os apps do Gestão foram feitos para salvar numa pasta do computador (pedindo permissão ao navegador).
   Aqui essa "pasta" passa a ser a pasta Database, lida e gravada pelo próprio sistema: sem pedir permissão,
   e com os mesmos arquivos de sempre. */
(function(){
'use strict';
const H={'X-Painel':'1'};
const APP_DE={'despesas':'despesas','despesas-maria':'despesas','despesas-maria_pasta':'despesas',
  'fichas':'fichas','fichas-maria':'fichas','fichas-maria_pasta':'fichas',
  'equipe':'equipe','equipe-maria':'equipe','equipe-maria_pasta':'equipe','todas':'todas'};
const NOMES={despesas:'Despesas',fichas:'Fichas Técnicas',equipe:'Folha',todas:'Database'};
const POR_ARQ={'despesas-maria-dados.json':'despesas','anotacoes-maria-dados.json':'despesas','fichas-maria-dados.json':'fichas','equipe-maria-dados.json':'equipe'};
const q=(app,p)=>'app='+encodeURIComponent(app)+'&p='+encodeURIComponent(p||'');
const junta=(a,b)=>a?a+'/'+b:b;
function erro(nome,msg){const e=new Error(msg||nome);e.name=nome;return e}
async function info(app,p){const r=await fetch('/api/gestao/info?'+q(app,p),{cache:'no-store'});if(!r.ok)throw erro('NotAllowedError','sistema fora do ar');return r.json()}

class Arquivo{
  constructor(app,cam,nome){this.kind='file';this.name=nome;this._a=app;this._c=cam}
  async getFile(){const r=await fetch('/api/gestao/arq?'+q(this._a,this._c),{cache:'no-store'});
    if(r.status===404)throw erro('NotFoundError','arquivo não encontrado');if(!r.ok)throw erro('NotAllowedError','sistema fora do ar');
    const b=await r.blob();return new File([b],this.name,{type:b.type,lastModified:+(r.headers.get('X-Mtime')||Date.now())})}
  async createWritable(){const partes=[],a=this._a,c=this._c;
    return{write:async d=>{partes.push(d&&typeof d==='object'&&d.type==='write'?d.data:d)},seek:async()=>{},truncate:async()=>{},abort:async()=>{partes.length=0},
      close:async()=>{const r=await fetch('/api/gestao/arq?'+q(a,c),{method:'POST',headers:Object.assign({'Content-Type':'application/octet-stream'},H),body:new Blob(partes)});
        if(!r.ok)throw erro(r.status===403?'NotAllowedError':'InvalidStateError','não consegui salvar ('+r.status+')')}}}
  async queryPermission(){return 'granted'} async requestPermission(){return 'granted'}
  async isSameEntry(o){return !!o&&o._a===this._a&&o._c===this._c}
}
class Pasta{
  constructor(app,cam,nome){this.kind='directory';this.name=nome;this._a=app;this._c=cam}
  _alvo(n){if(this._a==='todas'){const a=POR_ARQ[n];if(!a)throw erro('NotFoundError');return[a,n]}return[this._a,junta(this._c,n)]}
  async getFileHandle(n,o){const[a,c]=this._alvo(n);if(!(o&&o.create)){const i=await info(a,c);if(!i.existe||i.pasta)throw erro(i.pasta?'TypeMismatchError':'NotFoundError')}return new Arquivo(a,c,n)}
  async getDirectoryHandle(n,o){if(this._a==='todas')throw erro('NotFoundError');const c=junta(this._c,n);
    if(o&&o.create){await fetch('/api/gestao/pasta?'+q(this._a,c),{method:'POST',headers:H})}else{const i=await info(this._a,c);if(!i.existe||!i.pasta)throw erro('NotFoundError')}
    return new Pasta(this._a,c,n)}
  async removeEntry(n){const[a,c]=this._alvo(n);const r=await fetch('/api/gestao/apagar?'+q(a,c),{method:'POST',headers:H});if(r.status===404)throw erro('NotFoundError')}
  async *entries(){if(this._a==='todas')return;const r=await fetch('/api/gestao/lista?'+q(this._a,this._c),{cache:'no-store'});const l=r.ok?await r.json():[];
    for(const x of l)yield[x.nome,x.pasta?new Pasta(this._a,junta(this._c,x.nome),x.nome):new Arquivo(this._a,junta(this._c,x.nome),x.nome)]}
  async *values(){for await(const[,h]of this.entries())yield h}
  async *keys(){for await(const[n]of this.entries())yield n}
  [Symbol.asyncIterator](){return this.entries()}
  async queryPermission(){return 'granted'} async requestPermission(){return 'granted'}
  async isSameEntry(o){return !!o&&o._a===this._a&&o._c===this._c}
}
const cache={};
window.__pastaServidor=function(nome){const a=APP_DE[String(nome||'')];if(!a)return null;return cache[a]||(cache[a]=new Pasta(a,'',NOMES[a]))};
window.showDirectoryPicker=async()=>window.__pastaServidor('todas');

/* Antes de abrir os apps: traz para o navegador a versão mais nova dos dados que está na pasta. */
const CHAVES={despesas:'maria_despesas_v1',fichas:'maria_fichas_v1',equipe:'maria_equipe_v1',notas:'maria_notas_v1'};
try{
  const x=new XMLHttpRequest();x.open('GET','/api/gestao/dados',false);x.send();
  if(x.status===200){const d=JSON.parse(x.responseText);
    for(const k in CHAVES){const arq=d[k];if(!arq||!arq.dados)continue;let loc=null;try{loc=JSON.parse(localStorage.getItem(CHAVES[k])||'null')}catch(e){}
      const ta=+arq.dados._salvoEm||Date.parse(arq.salvoEm||'')||1,tl=loc?(+loc._salvoEm||0):-1;
      if(!loc||ta>tl){if(!arq.dados._salvoEm)arq.dados._salvoEm=ta;try{localStorage.setItem(CHAVES[k],JSON.stringify(arq.dados))}catch(e){}}}
    window.__gestaoCfg=d.cfg||{}}
}catch(e){console.warn('Gestão: não consegui ler a pasta de dados',e)}
})();

</script>

  if(u==='%')return v.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';return v.toLocaleString('pt-BR',{maximumFractionDigits:2})+(u&&u!=='num'?' '+u:'')};
const fQuando=iso=>{const d=new Date(iso);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' · '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};

let tBk=null,ultArq=0;

function idbH(nome){return Promise.resolve(window.__pastaServidor(nome))}
async function pastaNT(){const h=await idbH('despesas-maria_pasta');if(!h)return null;try{return (await h.queryPermission({mode:'readwrite'}))==='granted'?h:null}catch(e){return null}}
const ARQN='anotacoes-maria-dados.json';
async function backupNT(){try{const h=await pastaNT();if(!h)return;const fh=await h.getFileHandle(ARQN,{create:true}),w=await fh.createWritable();
  await w.write(JSON.stringify({app:'anotacoes-maria',salvoEm:new Date().toISOString(),dados:NT}));await w.close();ultArq=NT._salvoEm}catch(e){}}
async function lerArqNT(){try{const h=await pastaNT();if(!h)return false;const f=await (await h.getFileHandle(ARQN)).getFile(),j=JSON.parse(await f.text());
  if(j&&j.dados&&(j.dados._salvoEm||0)>(NT._salvoEm||0)){NT=Object.assign({notas:[],metas:[]},j.dados);try{localStorage.setItem(NK,JSON.stringify(NT))}catch(e){}renderTudo();toast2('Anotações recuperadas da pasta Database')}
  ultArq=Math.max(ultArq,(j.dados&&j.dados._salvoEm)||0);return true}catch(e){return false}}
let arqLido=false;
setInterval(async()=>{if(!arqLido)arqLido=await lerArqNT();if(NT._salvoEm>ultArq)backupNT()},20000);
setTimeout(async()=>{arqLido=await lerArqNT()},2500);

/* ---------- métricas para as metas (vêm do Painel) ---------- */
let cacheM={};
function metricas(ym){if(ym in cacheM)return cacheM[ym];const f=frame('painel');if(!f.pronto)return null;
  try{const w=f.contentWindow;if(typeof w.mariaMetricas!=='function')return null;return cacheM[ym]=w.mariaMetricas(ym)}catch(e){return null}}
const mesMeta=m=>m.recorrente!==false||!m.mes||(MET[m.metrica]&&MET[m.metrica].ag)?ymHoje():m.mes;
function valorMeta(m,ym){ym=ym||mesMeta(m);if(m.metrica==='manual')return +m.atual;const d=MET[m.metrica];
  if(d.ag){let v;if(ym===ymHoje()){const r=metricasAgora();v=r?r[m.metrica]:NaN;guardarFoto(m.metrica,ym,v)}else v=NT.snap&&NT.snap[m.metrica]?NT.snap[m.metrica][ym]:NaN;if(v==null||!isFinite(v))return NaN;return d.u==='%'?v*100:v}const r=metricas(ym);if(!r)return NaN;let v=r[m.metrica];if(!isFinite(v))return NaN;return MET[m.metrica].u==='%'?v*100:v}
const unidM=m=>m.metrica==='manual'?(m.unid||'num'):MET[m.metrica].u;
const sentM=m=>m.metrica==='manual'?(m.sentido||'maior'):MET[m.metrica].s;
function avaliar(m){const ym=mesMeta(m),v=valorMeta(m,ym),a=+m.alvo,s=sentM(m),cur=m.metrica!=='manual'&&ym===ymHoje();
  if(!isFinite(v)||!(a>0||a===0&&s==='menor'))return{v,pr:0,st:['neu','Sem dados ainda'],cor:'#d9c6b3'};
  const pr=s==='maior'?Math.max(0,Math.min(1,v/a)):(v<=a?1:Math.max(0,Math.min(1,a/v)));
  let st,proj=NaN;
  if(m.metrica==='fat'&&cur){const r=metricas(ym);proj=r?r.proj:NaN}
  if(MET[m.metrica]&&MET[m.metrica].ag)st=v>=a?['ok','✓ Meta batida']:pr>=.9?['vai','↗ Falta pouco']:['vai','… Em andamento'];
  else if(s==='maior'){if(v>=a)st=['ok','✓ Meta batida'];else if(cur&&isFinite(proj))st=proj>=a?['vai','↗ No ritmo de bater']:['mal','! Abaixo do ritmo'];
    else if(cur||m.metrica==='manual')st=['vai','… Em andamento'];else st=['mal','✕ Não bateu']}
  else{if(v<=a)st=['ok',cur?'✓ Dentro da meta':'✓ Meta batida'];else st=['mal',cur?'! Acima da meta':'✕ Não bateu']}
  const cor=st[0]==='ok'?'#2E7D52':st[0]==='vai'?'#FFB21E':'#C2412D';
  return{v,pr,st,cor,proj,ym,cur}}

function cardMeta(m){const a=avaliar(m),u=unidM(m),s=sentM(m),nN=NT.notas.filter(n=>!n.apagada&&n.meta===m.id).length;
  let spk='';if(m.metrica!=='manual'){const ms=[];let y=mesMeta(m);for(let i=0;i<6;i++){ms.unshift(y);y=ymAnt(y)}const vs=ms.map(x=>valorMeta(m,x)),mx=Math.max(+m.alvo||0,...vs.filter(isFinite))||1;
    spk=`<div class="spk" title="${MET[m.metrica].ag?'Como estava no fim de cada mês (o app começa a registrar a partir de agora)':'Últimos 6 meses'}">${ms.map((x,i)=>{const v=vs[i],ok=isFinite(v)&&(s==='maior'?v>=m.alvo:v<=m.alvo);
      return `<div title="${nomeMes(x)}: ${fNum(v,u)}"><i style="height:${isFinite(v)?Math.max(3,v/mx*34):2}px;background:${!isFinite(v)?'#EDE3D9':ok?'#2E7D52':x===ymHoje()?'#FFB21E':'#E8B4A8'}"></i><small>${mesCurto(x)}</small></div>`}).join('')}</div>`}
  const falta=isFinite(a.v)?(s==='maior'?m.alvo-a.v:a.v-m.alvo):NaN;
  return `<div class="mt${m.arquivada?' arq':''}"><div class="tp"><div><h3>${esc(m.titulo||MET[m.metrica].n)}</h3><div class="met">${m.metrica==='manual'?'Valor atualizado por você':esc(MET[m.metrica].n)+' · '+(MET[m.metrica].ag?'situação de hoje':m.recorrente!==false?'todo mês':nomeMes(m.mes))} · ${s==='maior'?'quanto mais, melhor':'quanto menos, melhor'}</div></div>
    <div class="acs">${m.metrica==='manual'?`<button class="ic-b" title="Atualizar o valor" onclick="atualizarManual('${m.id}')">${ico('lapis')}</button>`:''}<button class="ic-b" title="Editar a meta" onclick="abrirMeta('${m.id}')">${m.metrica==='manual'?ico('cfg'):ico('lapis')}</button><button class="ic-b" title="${m.arquivada?'Reativar':'Concluir / guardar'}" onclick="arquivarMeta('${m.id}')">${ico(m.arquivada?'vol':'ok')}</button><button class="ic-b" title="Excluir" onclick="excluirMeta('${m.id}')">${ico('lixo')}</button></div></div>
    <div class="vv"><b>${fNum(a.v,u)}</b><span>de ${fNum(+m.alvo,u)}${isFinite(a.v)&&falta>0?` · ${s==='maior'?'faltam':'passou'} ${fNum(falta,u==='%'?'%':u)}${u==='%'?' p.p.':''}`.replace('% p.p.',' p.p.'):''}</span></div>
    <div class="gauge" title="${Math.round(a.pr*100)}% do caminho"><div class="f" style="width:${a.pr*100}%;background:${a.cor}"></div>${isFinite(a.proj)&&+m.alvo>0?`<div class="pj" style="left:${Math.min(100,a.proj/m.alvo*100)}%" title="No ritmo atual: ${fNum(a.proj,'R$')}"></div>`:''}<div class="al"></div></div>
    <div class="rod"><span class="bdg ${a.st[0]}">${a.st[1]}</span><span>${!isFinite(a.v)&&MET[m.metrica]&&MET[m.metrica].ag?`coloque os preços do ${MET[m.metrica].cn} no Preço por canal`:''}${!isFinite(a.v)&&MET[m.metrica]&&MET[m.metrica].ag?'':isFinite(a.proj)?'no ritmo atual: <b>'+fNum(a.proj,'R$')+'</b>':m.metrica==='manual'&&m.prazo?'prazo: '+new Date(m.prazo+'T12:00').toLocaleDateString('pt-BR'):Math.round(a.pr*100)+'% do caminho'}</span></div>
    ${MET[m.metrica]&&MET[m.metrica].ag?`<button class="lk" onclick="abrir('fichas','canais')">Ver no Preço por canal ↗</button>`:''}${spk}${nN?`<button class="lk" onclick="F={q:'',st:'todas',tipo:'',app:'',meta:'${m.id}'};renderPg();document.getElementById('npNotas').scrollIntoView({behavior:'smooth'})">${nN} anotaç${nN===1?'ão ligada':'ões ligadas'} a esta meta →</button>`:''}</div>`}
function barraFiltro(){const apps=[...new Set(NT.notas.filter(n=>!n.apagada&&n.ctx).map(n=>n.ctx.app))];
  return `<div class="np-bar"><input type="search" placeholder="Buscar nas anotações…" value="${esc(F.q)}" oninput="F.q=this.value;document.getElementById('npLista').innerHTML=listaNotas();ajustarTAs(pg)">

  ${F.meta?`<button class="np-btn cl" onclick="F.meta='';renderPg()">Meta: ${esc((NT.metas.find(m=>m.id===F.meta)||{}).titulo||'')} ✕</button>`:''}</div>`}
function filtradas(){const q=F.q.trim().toLowerCase();return NT.notas.filter(n=>!n.apagada&&(F.st==='todas'||(F.st==='abertas'?n.status!=='feito':n.status===F.st))&&(!F.tipo||n.tipo===F.tipo)&&(!F.app||(n.ctx&&n.ctx.app===F.app))&&(!F.meta||n.meta===F.meta)
  &&(!q||((n.titulo||'')+' '+(n.texto||'')).toLowerCase().includes(q))).sort((a,b)=>(b.fixada?1:0)-(a.fixada?1:0)||b.criado.localeCompare(a.criado))}
function listaNotas(){const ls=filtradas();if(!ls.length)return `<div class="np-vazio">${NT.notas.some(n=>!n.apagada)?'Nenhuma anotação com esses filtros.':'Nenhuma anotação ainda. Use o botão <b>Anotar</b>, no canto de qualquer tela, para guardar uma ideia na hora em que ela surgir.'}</div>`;
  let out='',mesA=null;const fx=ls.filter(n=>n.fixada);if(fx.length)out+=`<div class="np-mes">Fixadas</div>`+fx.map(cardNota).join('');
  ls.filter(n=>!n.fixada).forEach(n=>{const ym=n.criado.slice(0,7);if(ym!==mesA){mesA=ym;const s=nomeMes(ym);out+=`<div class="np-mes">${s[0].toUpperCase()+s.slice(1)}</div>`}out+=cardNota(n)});return out}

     <div id="mMesW" style="${m.recorrente!==false?'display:none':''}"><label>Mês</label><input id="mMes" type="month" value="${m.mes||ymHoje()}"></div><p class="dica" id="mDica"></p></div>
   <div id="mMan"><div class="g2"><div><label>Valor atual</label><input id="mAtual" inputmode="decimal" value="${m.atual!=null?String(m.atual).replace('.',','):''}"></div><div><label>Meta</label><input id="mAlvo2" inputmode="decimal" value="${m.alvo!=null&&m.metrica==='manual'?String(m.alvo).replace('.',','):''}"></div></div>

  md.classList.add('on');trocarMet();setTimeout(()=>$('mTit').focus(),50)}
function trocarMet(){const k=$('mMet').value,man=k==='manual';$('mAuto').style.display=man?'none':'';$('mMan').style.display=man?'':'none';if(man)return;
  const d=MET[k];$('mAlvoL').textContent='Meta'+(d.u==='%'?' (%)':d.u==='R$'?' (R$)':' ('+d.u+')')+(d.s==='menor'?' · no máximo':' · pelo menos');
  $('mRecW').style.visibility=d.ag?'hidden':'';if(d.ag){$('mMesW').style.display='none';const r=metricasAgora();
    if(!r){$('mDica').innerHTML='Carregando os números do Preço por canal…';setTimeout(()=>{if($('npModal').classList.contains('on')&&$('mMet').value===k)trocarMet()},700)}
    else{const v=r[k],cp=d.cp?r[d.cp]:null,tot=d.tot?r[d.tot]:null,nc=d.cb?r[d.cb]:null;
      $('mDica').innerHTML=(d.cb?(nc?`Média dos ${nc} combo(s) com preço no ${d.cn}, já com taxas, impostos e custos fixos. Hoje: <b>${fNum(v*100,'%')}</b>.`:`Nenhum combo tem preço cadastrado no ${d.cn} ainda. Cadastre em Fichas › Preço por canal.`)
        :!cp?`Você ainda não colocou os preços do ${d.cn} em Fichas › Preço por canal. A meta começa a medir quando colocar.`
        :d.tot?`Pizzas com preço que deixa margem no mínimo e sobra igual à do balcão. Hoje: <b>${v} de ${cp}</b> pizzas com preço no ${d.cn} (${tot} no cardápio).`
        :`Média das ${cp} pizzas com preço no ${d.cn}, já com comissão, taxas, impostos e custos fixos. Hoje: <b>${fNum(v*100,'%')}</b>.`)+' Atualiza sozinho quando você muda preços ou custos.';
      if(d.tot&&!$('mAlvo').value)$('mAlvo').value=tot}
    if(!$('mTit').value)$('mTit').placeholder=d.n;return}
  $('mRecW').style.visibility='';
  const r=metricas(ymHoje()),ra=metricas(ymAnt(ymHoje())),v=x=>x&&isFinite(x[k])?fNum(d.u==='%'?x[k]*100:x[k],d.u):'—';
  $('mDica').innerHTML=`O medidor puxa esse número sozinho dos seus lançamentos. Mês passado: <b>${v(ra)}</b> · este mês até agora: <b>${v(r)}</b>.`;
  if(!$('mTit').value||$('mTit').dataset.auto){$('mTit').value='';$('mTit').placeholder=d.n}}
const numBR=s=>{s=String(s||'').trim().replace(/[R$%\s]/g,'');if(!s.includes(',')&&/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
function salvarMeta(id){const k=$('mMet').value,man=k==='manual',alvo=numBR(man?$('mAlvo2').value:$('mAlvo').value);
  if(!isFinite(alvo))return toast2('Coloque o valor da meta');
  let m=id?NT.metas.find(x=>x.id===id):null;if(!m){m={id:novoId(),criada:new Date().toISOString()};NT.metas.push(m)}
  Object.assign(m,{metrica:k,titulo:$('mTit').value.trim()||(man?'Minha meta':MET[k].n),alvo});
  if(man)Object.assign(m,{atual:numBR($('mAtual').value)||0,unid:$('mUn').value,sentido:$('mSen').value,prazo:$('mPrazo').value||null});
  else Object.assign(m,MET[k].ag?{recorrente:true,mes:ymHoje()}:{recorrente:$('mRec').value==='1',mes:$('mMes').value||ymHoje()});
  salvarNT();$('npModal').classList.remove('on');renderTudo();toast2(id?'Meta atualizada':'Meta criada')}
function atualizarManual(id){const m=NT.metas.find(x=>x.id===id);const v=prompt('Valor atual de "'+m.titulo+'":',String(m.atual??'').replace('.',','));if(v==null)return;const n=numBR(v);if(!isFinite(n))return;
  m.atual=n;(m.hist=m.hist||[]).push([new Date().toISOString().slice(0,10),n]);salvarNT();renderTudo()}
function arquivarMeta(id){const m=NT.metas.find(x=>x.id===id);m.arquivada=!m.arquivada;salvarNT();renderTudo();toast2(m.arquivada?'Meta guardada em "concluídas"':'Meta reativada')}
function excluirMeta(id){const i=NT.metas.findIndex(x=>x.id===id);if(i<0)return;const m=NT.metas.splice(i,1)[0];salvarNT();renderTudo();toast2('Meta excluída',()=>{NT.metas.splice(i,0,m);salvarNT();renderTudo()})}

/* ---------- gaveta rápida (de qualquer tela) ---------- */
let gTipo='ideia';
function abrirGav(){if(!$('npGav')){document.body.insertAdjacentHTML('beforeend','<div id="npSombra" onclick="fecharGav()"></div><aside id="npGav" aria-label="Anotações"></aside>')}
  const r=NT.rascunho||{};gTipo=r.tipo||'ideia';renderGav(true);document.body.classList.add('gav-on');setTimeout(()=>{const t=$('gTxt');if(t){t.focus();t.selectionStart=t.value.length}},120)}
function fecharGav(){document.body.classList.remove('gav-on')}
function renderGav(novo){const g=$('npGav');if(!g)return;const c=ctxAtual(),r=NT.rascunho||{},ms=NT.metas.filter(m=>!m.arquivada);
  const daqui=c?NT.notas.filter(n=>!n.apagada&&n.ctx&&n.ctx.app===c.app&&n.ctx.tab===c.tab).sort((a,b)=>b.criado.localeCompare(a.criado)):[];
  const outras=NT.notas.filter(n=>!n.apagada&&!daqui.includes(n)&&n.status!=='feito').sort((a,b)=>b.criado.localeCompare(a.criado)).slice(0,5);
  const mini=n=>{const t=TIPOS[n.tipo]||TIPOS.ideia;return `<div class="gv-n" style="--c:${t[1]}"><b>${esc(n.titulo||t[0])}</b>${n.texto?`<p>${esc(n.texto)}</p>`:''}<div class="rd"><span>${fQuando(n.criado)}${n.ctx&&(!c||n.ctx.app!==c.app||n.ctx.tab!==c.tab)?' · '+esc(n.ctx.rot):''}</span>
    <span class="st">${STS.map(([k,l])=>`<button class="${n.status===k?'on '+k:''}" onclick="mexerNota('${n.id}','status','${k}')">${l}</button>`).join('')}</span></div></div>`};
  const txt=novo?(r.texto||''):($('gTxt')?$('gTxt').value:''),tit=novo?(r.titulo||''):($('gTit')?$('gTit').value:''),mt=novo?(r.meta||''):($('gMeta')?$('gMeta').value:'');
  g.innerHTML=`<div class="gv-top"><div><h3>Anotar</h3><div class="onde">${c?'Você está em <b>'+esc(c.rot)+'</b>. A anotação fica ligada a essa tela.':'Anotação geral'}</div></div><button class="ic-b" title="Fechar (Esc)" onclick="fecharGav()">${ico('x')}</button></div>
  <div class="gv-c"><div class="gv-form"><input id="gTit" placeholder="Título (opcional)" value="${esc(tit)}" oninput="rascunho()">
    <textarea id="gTxt" placeholder="O que você pensou? Ex.: subir a Calabresa no iFood para R$ 64,99" oninput="rascunho()">${esc(txt)}</textarea>
    <div class="chips">${Object.entries(TIPOS).map(([k,[n,cor]])=>`<button class="${gTipo===k?'on':''}" style="--c:${cor}" onclick="gTipo='${k}';rascunho();renderGav()">${n}</button>`).join('')}</div>
    ${ms.length?`<select id="gMeta" onchange="rascunho()"><option value="">Ligar a uma meta (opcional)</option>${ms.map(m=>`<option value="${m.id}" ${mt===m.id?'selected':''}>${esc(m.titulo)}</option>`).join('')}</select>`:''}
    <div class="gv-ac"><small>Ctrl + Enter salva · o texto não se perde se fechar</small><button class="np-btn" onclick="salvarGav()">Salvar</button></div></div>
  ${ms.length?`<div class="gv-h">Metas do mês</div>${ms.slice(0,3).map(m=>{const a=avaliar(m),u=unidM(m);return `<div class="gv-m"><div class="rd"><b>${esc(m.titulo)}</b><span class="bdg ${a.st[0]}">${a.st[1]}</span></div><div class="gauge"><div class="f" style="width:${a.pr*100}%;background:${a.cor}"></div><div class="al"></div></div><div style="font-size:12px;color:var(--mut);margin-top:5px">${fNum(a.v,u)} de ${fNum(+m.alvo,u)}</div></div>`}).join('')}`:''}
  ${daqui.length?`<div class="gv-h">Anotadas nesta tela</div>${daqui.map(mini).join('')}`:''}
  ${outras.length?`<div class="gv-h">Em aberto em outras telas</div>${outras.map(mini).join('')}`:''}</div>
  <div class="gv-pe"><button class="np-btn cl" style="width:100%;justify-content:center" onclick="fecharGav();abrir('notas')">Abrir todas as anotações e metas →</button></div>`}
function rascunho(){NT.rascunho={titulo:$('gTit').value,texto:$('gTxt').value,tipo:gTipo,meta:$('gMeta')?$('gMeta').value:''};try{localStorage.setItem(NK,JSON.stringify(NT))}catch(e){}}
function salvarGav(){const tx=$('gTxt').value.trim(),ti=$('gTit').value.trim();if(!tx&&!ti){toast2('Escreva alguma coisa primeiro');return}
  const agora=new Date().toISOString();NT.notas.push({id:novoId(),titulo:ti,texto:tx,tipo:gTipo,status:gTipo==='decisao'?'feito':'afazer',criado:agora,editado:agora,ctx:ctxAtual(),meta:$('gMeta')&&$('gMeta').value||null});
  NT.rascunho=null;salvarNT();renderGav(true);if(pg)renderPg();toast2('Anotação salva')}

/* ---------- botão flutuante, atalhos e aviso ---------- */
function contarFab(){const b=$('npFab');if(!b)return;const n=NT.notas.filter(x=>!x.apagada&&x.status!=='feito').length;b.querySelector('.n').textContent=n;b.querySelector('.n').style.display=n?'':'none'}
document.body.insertAdjacentHTML('beforeend',`<button id="npFab" title="Anotar uma ideia (Alt + N)" onclick="abrirGav()"><svg viewBox="0 0 24 24">${SVG.lapis}</svg><span class="tx">Anotar</span><span class="n"></span></button><div id="npToast"></div>`);
let tT=null;function toast2(m,desfazer){const t=$('npToast');t.innerHTML=esc(m)+(desfazer?'<button>Desfazer</button>':'');if(desfazer)t.querySelector('button').onclick=()=>{desfazer();t.classList.remove('on')};
  t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),desfazer?6000:2400)}
window.mariaNotas=()=>document.body.classList.contains('gav-on')?fecharGav():abrirGav();
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.body.classList.contains('gav-on')){e.preventDefault();salvarGav();return}if(e.altKey&&!e.ctrlKey&&(e.key==='n'||e.key==='N')){e.preventDefault();mariaNotas()}else if(e.key==='Escape'){if($('npModal')&&$('npModal').classList.contains('on'))$('npModal').classList.remove('on');else fecharGav()}});
window.addEventListener('storage',e=>{if(e.key===NK){try{NT=Object.assign({notas:[],metas:[]},JSON.parse(e.newValue||'{}'))}catch(x){}renderTudo()}});
contarFab();


function montarMenu(){
  $('menu').innerHTML=ORDEM.map(k=>{const a=APPS[k];return `<div class="app" data-app="${k}">
    <button class="ap" data-app="${k}" aria-label="${esc(a.nome)}"><span class="ic"><svg viewBox="0 0 24 24">${ICONES[k]}</svg></span><span class="nm">${esc(a.nome)}</span>${SV}</button>
    <div class="subs">${a.abas.map(([t,n])=>`<button data-app="${k}" data-tab="${esc(t)}">${esc(n)}</button>`).join('')}</div></div>`}).join('');
  marcar();
}
const aberta=k=>k in est.gavetas?!!est.gavetas[k]:k===est.app;
function marcar(){
  document.querySelectorAll('#menu .app').forEach(el=>{const k=el.dataset.app;
    el.classList.toggle('atual',k===est.app);
    el.classList.toggle('gaveta',aberta(k));
    el.querySelectorAll('.subs button').forEach(b=>b.classList.toggle('on',k===est.app&&b.dataset.tab===(est.abas[k]||APPS[k].abas[0][0])));
  });
}

/* ---------- abrir cada app dentro da casca, carregando só quando for usado ---------- */
function frame(k){
  if(frames[k])return frames[k];
  if(k==='notas'){frames.notas=frameNotas();return frames.notas}
  const f=document.createElement('iframe');
  f.title=APPS[k].nome;f.dataset.app=k;
  f.addEventListener('load',()=>{f.pronto=true;$('carregando').style.display='none';
    const t=est.abas[k];if(t)irAbaEm(k,t,true);
    if(k==='painel')atualizarPainel();
    if(k==='painel'||k==='fichas')renderTudo();
  });
  if(APPS[k].src)f.src=APPS[k].src+(k==='vendas'&&VENDAS_HASH?VENDAS_HASH:'');
  else f.srcdoc=APPS[k].html.replace('<!--MARIA-FONTES-->','<style>'+FONTES+'</style>');
  $('palco').appendChild(f);frames[k]=f;return f;
}
function abrir(k,tab){
  if(!APPS[k])k='painel';
  const mudou=est.app!==k;
  if(mudou)est.gavetas={};
  est.app=k;
  const f=frame(k);
  Object.values(frames).forEach(x=>x.classList.toggle('on',x===f));
  document.body.classList.toggle('notas-on',k==='notas');if(k==='notas'&&mudou)renderPg();
  if(tab)irAbaEm(k,tab);
  else if(mudou&&k==='painel'&&f.pronto)atualizarPainel();
  if(mudou&&f.pronto)setTimeout(()=>{try{f.contentWindow.mariaContar&&f.contentWindow.mariaContar()}catch(e){}},320);
  document.title='Mariá · '+APPS[k].nome;
  try{history.replaceState(null,'','#'+k+(est.abas[k]?'/'+est.abas[k]:''))}catch(e){}
  guardar();marcar();
}
function irAbaEm(k,tab,silencioso){
  est.abas[k]=tab;guardar();marcar();
  const f=frames[k];if(!f||!f.pronto)return;
  const w=f.contentWindow,d=f.contentDocument;
  try{
    if(k==='notas'){const el=document.getElementById(tab==='notas'?'npNotas':'npMetas');if(el&&!silencioso)el.scrollIntoView({behavior:'smooth',block:'start'});return}
    if(k==='vendas'){const b=d.querySelector('#tabs button[data-t="'+tab+'"]');if(b&&!b.classList.contains('on'))b.click();try{history.replaceState(null,'','#'+k+'/'+tab)}catch(e){}return}
    if(k==='painel'&&tab==='fech'){if(typeof w.abrirFechamento==='function')w.abrirFechamento();return}
    if(k==='painel'){try{w.fecharFech&&w.fecharFech()}catch(e){}const alvo=tab==='topo'?null:d.querySelectorAll('.sec.pg')[+tab];
      if(alvo)alvo.scrollIntoView({behavior:silencioso?'auto':'smooth',block:'start'});else w.scrollTo({top:0,behavior:silencioso?'auto':'smooth'});return}
    const b=d.querySelector('#tabs button[data-tab="'+tab+'"]');
    if(b)b.click();else if(typeof w.irAba==='function')w.irAba(tab);
  }catch(e){console.warn(e)}
  try{history.replaceState(null,'','#'+k+'/'+tab)}catch(e){}
}
function atualizarPainel(){const f=frames.painel;try{if(f&&f.pronto&&typeof f.contentWindow.atualizar==='function')f.contentWindow.atualizar(false)}catch(e){}}

/* chamados de dentro dos apps */
window.mariaAba=(k,tab)=>{if(!tab||est.abas[k]===tab)return;est.abas[k]=tab;guardar();marcar();if(k===est.app)try{history.replaceState(null,'','#'+k+'/'+tab)}catch(e){}};
window.mariaAbrir=(k)=>abrir(k);

/* ---------- barra lateral: abre ao passar o mouse ---------- */
const lado=$('lado');let tFecha=null;
const abrirLado=()=>{clearTimeout(tFecha);lado.classList.add('aberto')};
const fecharLado=()=>{clearTimeout(tFecha);if(est.fixo)return;tFecha=setTimeout(()=>{if(!lado.matches(':hover'))lado.classList.remove('aberto')},180)};
lado.addEventListener('mouseenter',()=>{clearTimeout(tFecha);tFecha=setTimeout(abrirLado,90)});
lado.addEventListener('mouseleave',fecharLado);
lado.addEventListener('focusin',abrirLado);
lado.addEventListener('focusout',e=>{if(!lado.contains(e.relatedTarget))fecharLado()});
$('menu').addEventListener('click',e=>{
  const s=e.target.closest('.subs button');
  if(s){abrir(s.dataset.app,s.dataset.tab);return}
  const a=e.target.closest('.ap');if(!a)return;const k=a.dataset.app;
  if(!lado.classList.contains('aberto')){abrir(k);abrirLado();return}  // toque em tela sem mouse
  if(k===est.app){est.gavetas[k]=!aberta(k);guardar();marcar();return}
  abrir(k);
});
function aplicarFixo(){document.body.classList.toggle('fixo',!!est.fixo);$('fixar').setAttribute('aria-pressed',est.fixo?'true':'false');
  $('fixarTx').textContent=est.fixo?'Recolher a barra':'Deixar a barra aberta';if(est.fixo)lado.classList.add('aberto')}
$('fixar').onclick=()=>{est.fixo=!est.fixo;guardar();aplicarFixo();if(!est.fixo)fecharLado()};

/* início: abre o último app usado (ou o do endereço) */
function saudar(){const d=new Date(),h=d.getHours();$('olaTx').textContent=(h<5?'Boa noite':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite')+', Paulo';
  $('olaDt').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
saudar();setInterval(saudar,60000);
montarMenu();aplicarFixo();
(()=>{const h=decodeURIComponent(location.hash.slice(1)).split('/');
  const bruto=location.hash.slice(1);
  if(/^(alerta|envios$|lembretes$)/.test(bruto)){VENDAS_HASH='#'+bruto;const m={envios:'envios',lembretes:'hoje'}[bruto];est.abas.vendas=m||'hoje';abrir('vendas')}
  else if(h[0]&&APPS[h[0]]){if(h[1])est.abas[h[0]]=h[1];abrir(h[0])}else abrir(APPS[est.app]?est.app:'vendas');})();
window.addEventListener('hashchange',()=>{const b=location.hash.slice(1);if(!/^(alerta|envios$|lembretes$)/.test(b))return;VENDAS_HASH='#'+b;abrir('vendas');const f=frames.vendas;try{if(f&&f.pronto)f.contentWindow.location.hash=b}catch(e){}});
</script>
</body>
